name: Build Windows onedir (Vergleichsprobe)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2
      - name: Build onedir
        run: pyinstaller --noconfirm --clean Starfield-Data-Analysis.spec
        env:
          SFDA_BUILD_MODE: onedir
      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir
          path: dist/
          retention-days: 7
