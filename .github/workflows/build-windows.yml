name: Build Windows package

# Baut das Windows-Paket aus genau dem Commit, der auch auf Nexus liegt.
# Ausloeser: manuell (workflow_dispatch) oder Push auf main.

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Build-Artefakt als Workflow-Artefakt hochladen"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "ssb_i/**"
      - "ssb_ui/**"
      - "sfda_cli.py"
      - "Starfield-Data-Analysis.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Paket bauen (Onefile, ohne eingebettetes Archiv)
        run: |
          pyinstaller --noconfirm --clean Starfield-Data-Analysis.spec
        env:
          SFDA_BUILD_MODE: onefile

      - name: Version pruefen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sfda = "dist\StarfieldDataAnalysis\sfda.exe"
          if (-not (Test-Path $sfda)) { throw "sfda.exe fehlt" }
          & $sfda --version
          & "dist\StarfieldDataAnalysis\StarfieldDataAnalysis.exe" --dump-pages --out pages.txt
          Get-Content pages.txt

      - name: SHA256SUMS schreiben
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "dist\StarfieldDataAnalysis" -File
          $lines = $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content -Path "dist\StarfieldDataAnalysis\SHA256SUMS" -Encoding ascii
          Get-Content "dist\StarfieldDataAnalysis\SHA256SUMS"

      - name: Artefakt hochladen
        if: ${{ inputs.upload_artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: Starfield-Data-Analysis-windows-x64
          path: dist/StarfieldDataAnalysis/
          retention-days: 30

      - name: ZIP erzeugen (Ordner als Wurzel)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\StarfieldDataAnalysis" -DestinationPath "dist\Starfield-Data-Analysis-windows-x64.zip"
          Get-Item "dist\Starfield-Data-Analysis-windows-x64.zip" | Select-Object Name, Length
